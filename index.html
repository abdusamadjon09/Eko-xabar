<style>
:root{
  --bg:#f5f2e8;
  --surface:#ffffff;
  --surface-2:#eef3ea;
  --ink:#12271b;
  --ink-soft:#4c5d51;
  --line:#e1ded0;
  --forest:#0e3d24;
  --leaf:#2f9e5b;
  --leaf-bright:#39b768;
  --amber:#d99a2b;
  --clay:#c1553f;
  --shadow: 0 10px 30px rgba(14,61,36,0.10);
  --radius: 18px;
  --font-display: 'Sora', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a13;
    --surface:#152418;
    --surface-2:#1b2c20;
    --ink:#eaf3ec;
    --ink-soft:#a9bcae;
    --line:#24382b;
    --forest:#1c5b36;
    --leaf:#3ec26f;
    --leaf-bright:#48d77e;
    --amber:#e6ad3f;
    --clay:#e07a63;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a13;
  --surface:#152418;
  --surface-2:#1b2c20;
  --ink:#eaf3ec;
  --ink-soft:#a9bcae;
  --line:#24382b;
  --forest:#1c5b36;
  --leaf:#3ec26f;
  --leaf-bright:#48d77e;
  --amber:#e6ad3f;
  --clay:#e07a63;
  --shadow: 0 10px 30px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  min-height:100vh;
  padding-bottom:78px;
}
::selection{background:var(--leaf); color:#fff}
a{color:inherit}
h1,h2,h3{font-family:var(--font-display); margin:0 0 6px; letter-spacing:-0.01em}
p{margin:0 0 10px; line-height:1.55; color:var(--ink-soft)}
button,input,textarea,select{font-family:inherit; font-size:16px}
.app-shell{max-width:480px; margin:0 auto; min-height:100vh; position:relative; background:var(--bg)}

/* top bar */
.topbar{
  position:sticky; top:0; z-index:20;
  background:linear-gradient(135deg,var(--forest),var(--leaf));
  color:#fff; padding:16px 18px 20px;
  border-radius:0 0 22px 22px;
  box-shadow:var(--shadow);
}
.topbar .row{display:flex; align-items:center; justify-content:space-between; gap:10px}
.brand{display:flex; align-items:center; gap:9px; font-family:var(--font-display); font-weight:800; font-size:19px}
.brand .mark{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;font-size:18px}
.brand small{display:block;font-weight:500;font-size:10.5px;opacity:.85; font-family:var(--font-body); letter-spacing:.01em}
.topbar .subtitle{font-size:13px; opacity:.92; margin-top:8px}
.iconbtn{
  background:rgba(255,255,255,0.16); border:0; color:#fff; width:38px;height:38px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;
}

/* content */
.content{padding:16px 16px 30px}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px; margin-bottom:14px; box-shadow:var(--shadow);
}
.card.flat{box-shadow:none}
.section-title{font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--ink); margin:22px 0 10px 2px}
.section-title:first-child{margin-top:0}

/* hero */
.hero{
  background:radial-gradient(120% 140% at 0% 0%, rgba(57,183,104,0.16), transparent 60%), var(--surface);
  border:1px solid var(--line);
}
.hero h1{font-size:23px; line-height:1.25}
.hero-stats{display:flex; gap:10px; margin-top:14px}
.stat-pill{flex:1; background:var(--surface-2); border-radius:14px; padding:10px 8px; text-align:center}
.stat-pill b{display:block; font-family:var(--font-display); font-size:19px; color:var(--leaf)}
:root[data-theme="dark"] .stat-pill b, @media (prefers-color-scheme: dark){ .stat-pill b{color:var(--leaf-bright)} }
.stat-pill span{font-size:10.5px; color:var(--ink-soft)}

/* form */
label{display:block; font-weight:600; font-size:13px; margin:14px 0 6px; color:var(--ink)}
label:first-child{margin-top:0}
input[type=text],input[type=tel],input[type=password],input[type=number],textarea,select{
  width:100%; padding:13px 14px; border-radius:13px; border:1.5px solid var(--line);
  background:var(--surface-2); color:var(--ink); outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--leaf)}
textarea{min-height:96px; resize:vertical}
input[type=file]{
  width:100%; padding:12px; border-radius:13px; border:1.5px dashed var(--line); background:var(--surface-2); color:var(--ink-soft); font-size:13px;
}
.hint{font-size:12px; color:var(--ink-soft); margin-top:5px}

.btn{
  appearance:none; border:0; cursor:pointer; width:100%; padding:14px 16px; border-radius:14px;
  font-family:var(--font-display); font-weight:700; font-size:14.5px; letter-spacing:.01em;
  background:var(--leaf); color:#fff; margin-top:16px; transition:transform .08s ease;
}
.btn:active{transform:scale(0.98)}
.btn.secondary{background:var(--surface-2); color:var(--ink); border:1.5px solid var(--line)}
.btn.danger{background:var(--clay)}
.btn.ghost{background:transparent; color:var(--leaf); padding:10px 4px; width:auto; margin-top:6px}
.btn.small{padding:9px 12px; font-size:13px; width:auto; margin-top:0}
.btn-row{display:flex; gap:8px}
.btn-row .btn{margin-top:0}

/* status badge */
.badge{display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:99px; font-size:11.5px; font-weight:700}
.badge.new{background:#e9edfb; color:#3149a8}
.badge.accepted{background:#fdf1d8; color:#8a5e0b}
.badge.in_progress{background:#e6f2ff; color:#175fa8}
.badge.cleaned{background:#e2f6e8; color:#146333}
.badge.rejected{background:#fbe7e5; color:#a3352a}
:root[data-theme="dark"] .badge.new{background:#22284a;color:#aab6f2}
:root[data-theme="dark"] .badge.accepted{background:#3a2f13;color:#f0c874}
:root[data-theme="dark"] .badge.in_progress{background:#12314a;color:#8fc4 f0}
:root[data-theme="dark"] .badge.cleaned{background:#12351f;color:#7fe3a4}
:root[data-theme="dark"] .badge.rejected{background:#3a1a17;color:#f0a99e}

.report-photo{width:100%; border-radius:14px; display:block; margin:10px 0; max-height:220px; object-fit:cover; background:var(--surface-2)}
.meta-row{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft); margin-bottom:3px}
.reward-line{display:flex; align-items:center; justify-content:space-between; background:var(--surface-2); border-radius:12px; padding:10px 12px; margin-top:10px}
.reward-line b{color:var(--amber); font-family:var(--font-display); font-size:16px}

.empty{text-align:center; padding:36px 10px; color:var(--ink-soft)}
.empty .big{font-size:34px; margin-bottom:8px}

/* alerts / toast */
.alert{padding:12px 14px; border-radius:13px; background:#e2f6e8; color:#146333; margin-bottom:12px; font-size:13.5px; font-weight:600}
.alert.error{background:#fbe7e5; color:#a3352a}
.toast{
  position:fixed; left:50%; bottom:92px; transform:translateX(-50%);
  background:var(--forest); color:#fff; padding:11px 18px; border-radius:99px; font-size:13.5px; font-weight:600;
  box-shadow:var(--shadow); z-index:60; opacity:0; pointer-events:none; transition:opacity .2s ease, bottom .2s ease;
  max-width:88%; text-align:center;
}
.toast.show{opacity:1; bottom:100px}

/* bottom nav */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  display:flex; justify-content:center;
}
.tabbar-inner{
  width:100%; max-width:480px; background:var(--surface); border-top:1px solid var(--line);
  display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 20px rgba(14,61,36,0.08);
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px;
  border:0; background:transparent; color:var(--ink-soft); font-size:10.5px; font-weight:600; cursor:pointer; border-radius:12px;
}
.tab .ic{font-size:19px}
.tab.active{color:var(--leaf)}
.tab.active .ic{transform:translateY(-1px)}

/* fab */
.fab{
  position:fixed; right:calc(50% - 240px + 18px); bottom:86px; z-index:31;
  width:56px; height:56px; border-radius:18px; background:var(--leaf); color:#fff; border:0;
  display:flex; align-items:center; justify-content:center; font-size:24px; box-shadow:0 10px 24px rgba(47,158,91,0.45); cursor:pointer;
}
@media (max-width:520px){ .fab{right:18px} }

.link-row{display:flex; justify-content:center; gap:16px; margin-top:14px; font-size:13px}
.link-row a{color:var(--leaf); font-weight:600}

table{width:100%; border-collapse:collapse; font-size:12.5px}
th,td{padding:8px 6px; border-bottom:1px solid var(--line); text-align:left}
th{color:var(--ink-soft); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.03em}

.map-link{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; color:var(--leaf); margin-top:4px}
.divider{height:1px; background:var(--line); margin:14px 0}
.avatar{width:40px;height:40px;border-radius:12px;background:var(--surface-2); display:flex;align-items:center;justify-content:center; font-weight:800; font-family:var(--font-display); color:var(--leaf)}
.profile-row{display:flex; align-items:center; gap:12px}
.profile-row .who b{display:block; font-size:15px}
.profile-row .who span{font-size:12.5px; color:var(--ink-soft)}
.role-chip{display:inline-block; margin-top:4px; font-size:10.5px; font-weight:800; letter-spacing:.03em; padding:3px 8px; border-radius:99px; background:var(--surface-2); color:var(--leaf)}
</style>
</head>
<body>
<div class="app-shell">
  <div id="app"></div>
  <div id="tabbar-slot"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- storage ---------------- */
const LS_USERS = 'ecoxabar_users_v1';
const LS_REPORTS = 'ecoxabar_reports_v1';
const LS_SESSION = 'ecoxabar_session_v1';

const STATUS = {
  new: 'Yangi', accepted: 'Qabul qilindi', in_progress: 'Jarayonda',
  cleaned: 'Tozalandi', rejected: 'Rad etildi'
};

function loadJSON(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e){ toast('Xotira to‘lgan — eski hisobotlarni o‘chiring.'); return false; }
}
function getUsers(){ return loadJSON(LS_USERS, []); }
function setUsers(u){ return saveJSON(LS_USERS, u); }
function getReports(){ return loadJSON(LS_REPORTS, []); }
function setReports(r){ return saveJSON(LS_REPORTS, r); }
function getSession(){ return loadJSON(LS_SESSION, null); }
function setSession(s){ saveJSON(LS_SESSION, s); }

async function hash(str){
  try{
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ return 'h_'+str.length+'_'+str; }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function now(){ return new Date().toLocaleString('uz-UZ',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }

async function seedAdmin(){
  const users = getUsers();
  if(!users.find(u=>u.phone==='admin')){
    users.push({id:uid(), name:'EcoXabar Admin', phone:'admin', passHash: await hash('EcoXabar2026!'), role:'admin', createdAt: now()});
    setUsers(users);
  }
}

function currentUser(){
  const s = getSession();
  if(!s) return null;
  return getUsers().find(u=>u.id===s.uid) || null;
}

/* ---------------- toast ---------------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ---------------- image resize ---------------- */
function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    if(!file) return resolve(null);
    if(!file.type.startsWith('image/')) return reject('type');
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
        else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject('img');
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject('read');
    reader.readAsDataURL(file);
  });
}

/* ---------------- router ---------------- */
function nav(hash){ location.hash = hash; }
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', async ()=>{ await seedAdmin(); render(); });

function route(){
  const h = (location.hash || '#/home').slice(2) || 'home';
  return h.split('?')[0];
}

function guard(roles){
  const u = currentUser();
  if(!u || !roles.includes(u.role)){
    nav('#/login');
    return null;
  }
  return u;
}

/* ---------------- shell chrome ---------------- */
function renderTabbar(){
  const slot = document.getElementById('tabbar-slot');
  const u = currentUser();
  const r = route();
  let tabs = [];
  if(!u){
    tabs = [
      {ic:'🏠', label:'Bosh sahifa', to:'home'},
      {ic:'🔐', label:'Kirish', to:'login'},
    ];
  } else if(u.role==='citizen'){
    tabs = [
      {ic:'🏠', label:'Bosh sahifa', to:'home'},
      {ic:'📋', label:'Murojaatlar', to:'my-reports'},
      {ic:'👤', label:'Profil', to:'profile'},
    ];
  } else if(u.role==='worker'){
    tabs = [
      {ic:'🚛', label:'Panel', to:'worker'},
      {ic:'🏠', label:'Bosh sahifa', to:'home'},
      {ic:'👤', label:'Profil', to:'profile'},
    ];
  } else {
    tabs = [
      {ic:'🛡️', label:'Admin', to:'admin'},
      {ic:'🏠', label:'Bosh sahifa', to:'home'},
      {ic:'👤', label:'Profil', to:'profile'},
    ];
  }
  slot.innerHTML = `
    ${(u && u.role==='citizen') ? `<button class="fab" onclick="nav('#/report')" aria-label="Xabar berish">＋</button>` : ''}
    <div class="tabbar"><div class="tabbar-inner">
      ${tabs.map(t=>`<button class="tab ${r===t.to?'active':''}" onclick="nav('#/${t.to}')"><span class="ic">${t.ic}</span>${t.label}</button>`).join('')}
    </div></div>
  `;
}

function topbar(title, subtitle, showBack){
  return `
  <div class="topbar">
    <div class="row">
      <div class="brand">
        ${showBack ? `<button class="iconbtn" onclick="history.back()">←</button>` : `<div class="mark">🌱</div>`}
        <div>${title}<small>${subtitle||''}</small></div>
      </div>
    </div>
  </div>`;
}

/* ---------------- views ---------------- */
function viewHome(){
  const reports = getReports();
  const users = getUsers();
  const stats = {
    reports: reports.length,
    cleaned: reports.filter(r=>r.status==='cleaned').length,
    citizens: users.filter(u=>u.role==='citizen').length,
    workers: users.filter(u=>u.role==='worker').length,
  };
  const u = currentUser();
  let cta = '';
  if(!u){
    cta = `<button class="btn" onclick="nav('#/register-citizen')">👤 Fuqaro sifatida ro‘yxatdan o‘tish</button>
           <button class="btn secondary" onclick="nav('#/register-worker')">🚛 Xodim sifatida ro‘yxatdan o‘tish</button>`;
  } else if(u.role==='citizen'){
    cta = `<button class="btn" onclick="nav('#/report')">📷 Xabar berish</button>`;
  } else if(u.role==='worker'){
    cta = `<button class="btn" onclick="nav('#/worker')">🚛 Panelga o‘tish</button>`;
  } else {
    cta = `<button class="btn" onclick="nav('#/admin')">🛡️ Admin panelga o‘tish</button>`;
  }
  return `
  ${topbar('EcoXabar', 'Toza hudud — sog‘lom kelajak')}
  <div class="content">
    <div class="card hero">
      <h1>Shahrimizni birga tozalaymiz 🌍</h1>
      <p>Chiqindi muammosini rasm bilan yuboring, ekologiya xodimlari uni ko‘rib chiqib, hududni tozalaydi.</p>
      ${cta}
      <div class="hero-stats">
        <div class="stat-pill"><b>${stats.reports}</b><span>Murojaat</span></div>
        <div class="stat-pill"><b>${stats.cleaned}</b><span>Tozalangan</span></div>
        <div class="stat-pill"><b>${stats.citizens}</b><span>Fuqaro</span></div>
        <div class="stat-pill"><b>${stats.workers}</b><span>Xodim</span></div>
      </div>
    </div>

    <div class="section-title">Qanday ishlaydi?</div>
    <div class="card flat" style="padding:6px 18px">
      ${[['📸','Fuqaro chiqindini suratga oladi'],['📍','Manzil yoki GPS yuboriladi'],['🚛','Ekologiya xodimi murojaatni qabul qiladi'],['♻️','Chiqindi olib ketiladi, holat yangilanadi'],['⭐','Tasdiqlangan murojaatga mukofot belgilanadi']]
        .map(([ic,t],i,arr)=>`<div style="display:flex;gap:12px;align-items:center;padding:12px 0;${i<arr.length-1?'border-bottom:1px solid var(--line)':''}"><span style="font-size:20px">${ic}</span><span style="font-size:13.5px;color:var(--ink)">${t}</span></div>`).join('')}
    </div>

    <div class="card flat" style="background:var(--surface-2); box-shadow:none">
      <p style="margin:0; font-size:12.5px">ℹ️ Bu — shu qurilma/brauzerda ishlaydigan demo ilova. Ma’lumotlar faqat shu qurilmada saqlanadi va boshqa foydalanuvchilarning qurilmalari bilan avtomatik sinxronlanmaydi.</p>
    </div>
  </div>`;
}

function viewRegister(role){
  const isWorker = role==='worker';
  return `
  ${topbar(isWorker?'Xodim ro‘yxati':'Fuqaro ro‘yxati', 'EcoXabar', true)}
  <div class="content">
    <div class="card">
      <h2>${isWorker?'🚛 Ekologiya xodimi':'👤 Fuqaro'} sifatida ro‘yxatdan o‘tish</h2>
      ${isWorker?'<p>Prototipda xodim mustaqil ro‘yxatdan o‘tadi.</p>':''}
      <div id="form-msg"></div>
      <label>Ism va familiya</label>
      <input type="text" id="r-name" placeholder="Ism Familiya">
      <label>Telefon</label>
      <input type="tel" id="r-phone" placeholder="+998901234567">
      <label>Parol</label>
      <input type="password" id="r-pass" placeholder="Kamida 6 belgi">
      <button class="btn" onclick="doRegister('${role}')">Ro‘yxatdan o‘tish</button>
      <div class="link-row"><a onclick="nav('#/login')">Allaqachon hisobim bor</a></div>
    </div>
  </div>`;
}

async function doRegister(role){
  const name = document.getElementById('r-name').value.trim();
  const phone = document.getElementById('r-phone').value.trim();
  const pass = document.getElementById('r-pass').value;
  const msg = document.getElementById('form-msg');
  if(!name || !phone || pass.length<6){
    msg.innerHTML = `<div class="alert error">Ism, telefon va kamida 6 belgili parol kiriting.</div>`; return;
  }
  const users = getUsers();
  if(users.find(u=>u.phone===phone)){
    msg.innerHTML = `<div class="alert error">Bu telefon allaqachon ro‘yxatdan o‘tgan.</div>`; return;
  }
  const user = {id:uid(), name, phone, passHash: await hash(pass), role, createdAt: now()};
  users.push(user); setUsers(users);
  setSession({uid:user.id});
  toast('Ro‘yxatdan muvaffaqiyatli o‘tdingiz!');
  nav(role==='worker' ? '#/worker' : '#/home');
}

function viewLogin(){
  return `
  ${topbar('Kirish','EcoXabar', true)}
  <div class="content">
    <div class="card">
      <h2>🔐 Tizimga kirish</h2>
      <div id="form-msg"></div>
      <label>Telefon yoki login</label>
      <input type="text" id="l-phone" placeholder="Telefon raqam yoki admin">
      <label>Parol</label>
      <input type="password" id="l-pass" placeholder="Parol">
      <button class="btn" onclick="doLogin()">Kirish</button>
      <div class="link-row">
        <a onclick="nav('#/register-citizen')">👤 Fuqaro ro‘yxati</a>
        <a onclick="nav('#/register-worker')">🚛 Xodim ro‘yxati</a>
      </div>
    </div>
  </div>`;
}

async function doLogin(){
  const phone = document.getElementById('l-phone').value.trim();
  const pass = document.getElementById('l-pass').value;
  const msg = document.getElementById('form-msg');
  const users = getUsers();
  const u = users.find(x=>x.phone===phone);
  const h = await hash(pass);
  if(!u || u.passHash !== h){
    msg.innerHTML = `<div class="alert error">Login yoki parol noto‘g‘ri.</div>`; return;
  }
  setSession({uid:u.id});
  toast('Xush kelibsiz, '+u.name+'!');
  nav(u.role==='admin'?'#/admin':(u.role==='worker'?'#/worker':'#/home'));
}

function logout(){ setSession(null); toast('Chiqdingiz'); nav('#/home'); }

function viewProfile(){
  const u = currentUser();
  if(!u){ nav('#/login'); return ''; }
  const roleLabel = u.role==='citizen'?'Fuqaro':(u.role==='worker'?'Ekologiya xodimi':'Admin');
  const initials = u.name.split(' ').map(s=>s[0]).join('').slice(0,2).toUpperCase();
  return `
  ${topbar('Profil','EcoXabar')}
  <div class="content">
    <div class="card">
      <div class="profile-row">
        <div class="avatar">${initials}</div>
        <div class="who">
          <b>${u.name}</b>
          <span>${u.phone}</span>
          <span class="role-chip">${roleLabel}</span>
        </div>
      </div>
      <div class="divider"></div>
      <p style="font-size:12.5px">Ro‘yxatdan o‘tgan sana: ${u.createdAt||'—'}</p>
      <button class="btn danger" onclick="logout()">Chiqish</button>
    </div>
  </div>`;
}

function viewReportForm(){
  const u = guard(['citizen']); if(!u) return '';
  return `
  ${topbar('Xabar berish','EcoXabar', true)}
  <div class="content">
    <div class="card">
      <h2>📷 Chiqindi haqida xabar berish</h2>
      <div id="form-msg"></div>
      <label>Muammo</label>
      <textarea id="rp-problem" placeholder="Chiqindi qayerda va qanday muammo bor?"></textarea>
      <label>Manzil</label>
      <input type="text" id="rp-address" placeholder="Ko‘cha, mahalla, mo‘ljal">
      <div class="btn-row">
        <input type="text" id="rp-lat" placeholder="Latitude" style="display:none">
        <input type="text" id="rp-lon" placeholder="Longitude" style="display:none">
      </div>
      <button type="button" class="btn secondary" onclick="getGPS()">📍 GPS aniqlash</button>
      <div id="gps-status" class="hint"></div>
      <label>📸 Rasm</label>
      <input type="file" id="rp-photo" accept="image/*" capture="environment">
      <div class="hint">Rasm avtomatik siqiladi va shu qurilmada saqlanadi.</div>
      <button class="btn" id="rp-submit" onclick="submitReport()">🚀 Yuborish</button>
    </div>
  </div>`;
}

function getGPS(){
  const status = document.getElementById('gps-status');
  if(!navigator.geolocation){ status.textContent = 'GPS qo‘llanmaydi'; return; }
  status.textContent = 'Aniqlanmoqda…';
  navigator.geolocation.getCurrentPosition(p=>{
    document.getElementById('rp-lat').value = p.coords.latitude;
    document.getElementById('rp-lon').value = p.coords.longitude;
    status.textContent = `📍 Aniqlandi: ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`;
  }, ()=>{ status.textContent = 'GPSga ruxsat berilmadi'; });
}

async function submitReport(){
  const u = currentUser(); if(!u) return;
  const problem = document.getElementById('rp-problem').value.trim();
  const address = document.getElementById('rp-address').value.trim();
  const lat = document.getElementById('rp-lat').value;
  const lon = document.getElementById('rp-lon').value;
  const fileInput = document.getElementById('rp-photo');
  const msg = document.getElementById('form-msg');
  if(!problem){ msg.innerHTML = `<div class="alert error">Muammo haqida yozing.</div>`; return; }
  const btn = document.getElementById('rp-submit');
  btn.textContent = 'Yuborilmoqda…'; btn.disabled = true;
  let photo = null;
  try{
    if(fileInput.files[0]) photo = await resizeImage(fileInput.files[0], 900, 0.6);
  }catch(e){ msg.innerHTML = `<div class="alert error">Rasmni o‘qib bo‘lmadi, boshqa rasm tanlang.</div>`; btn.textContent='🚀 Yuborish'; btn.disabled=false; return; }

  const reports = getReports();
  reports.unshift({
    id: uid(), userId: u.id, problem, address, lat, lon, photo,
    status: 'new', reward: 0, note: '', createdAt: now(), updatedAt: now()
  });
  const ok = setReports(reports);
  btn.textContent = '🚀 Yuborish'; btn.disabled = false;
  if(ok){ toast('Murojaat yuborildi!'); nav('#/my-reports'); }
  else { msg.innerHTML = `<div class="alert error">Saqlashda xatolik — xotira to‘lgan bo‘lishi mumkin.</div>`; }
}

function viewMyReports(){
  const u = guard(['citizen']); if(!u) return '';
  const rs = getReports().filter(r=>r.userId===u.id);
  return `
  ${topbar('Murojaatlarim','EcoXabar')}
  <div class="content">
    ${rs.length===0 ? `<div class="empty"><div class="big">📋</div><p>Hali murojaat yo‘q.<br>Birinchi xabaringizni yuboring.</p><button class="btn" onclick="nav('#/report')" style="width:auto;padding:12px 20px">📷 Xabar berish</button></div>` : rs.map(reportCard).join('')}
  </div>`;
}

function reportCard(r){
  const map = (r.lat && r.lon) ? `<a class="map-link" target="_blank" href="https://www.google.com/maps?q=${r.lat},${r.lon}">🗺️ Xaritada ko‘rish</a>` : '';
  return `
  <div class="card">
    <div class="meta-row">#${r.id.slice(-5)} · ${r.createdAt}</div>
    <h3>${escapeHtml(r.problem)}</h3>
    <span class="badge ${r.status}">${STATUS[r.status]}</span>
    <p style="margin-top:8px">📍 ${escapeHtml(r.address) || 'Manzil kiritilmagan'}</p>
    ${map}
    ${r.photo ? `<img class="report-photo" src="${r.photo}">` : ''}
    <div class="reward-line"><span>⭐ Mukofot</span><b>${r.reward.toLocaleString('uz-UZ')} so‘m</b></div>
    ${r.note ? `<p style="margin-top:8px">🚛 Izoh: ${escapeHtml(r.note)}</p>` : ''}
  </div>`;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function viewWorker(){
  const u = guard(['worker','admin']); if(!u) return '';
  const users = getUsers();
  const rs = getReports().map(r=>({...r, citizen: users.find(x=>x.id===r.userId)}));
  return `
  ${topbar('Mashina paneli','EcoXabar')}
  <div class="content">
    <div class="card flat" style="background:var(--surface-2); box-shadow:none">
      <p style="margin:0; font-size:13px">Kelgan murojaatlarni ko‘ring va bajarilish holatini yangilang.</p>
    </div>
    ${rs.length===0 ? `<div class="empty"><div class="big">🚛</div><p>Hozircha murojaat yo‘q.</p></div>` :
      rs.map(r=>`
      <div class="card">
        <div class="meta-row">#${r.id.slice(-5)} · ${r.createdAt}</div>
        <h3>${escapeHtml(r.problem)}</h3>
        <p>👤 ${r.citizen?escapeHtml(r.citizen.name):'—'} | 📞 ${r.citizen?r.citizen.phone:'—'}</p>
        <p>📍 ${escapeHtml(r.address) || 'Manzil yo‘q'}</p>
        ${(r.lat && r.lon) ? `<a class="map-link" target="_blank" href="https://www.google.com/maps?q=${r.lat},${r.lon}">🗺️ Xaritada</a>` : ''}
        ${r.photo ? `<img class="report-photo" src="${r.photo}">` : ''}
        <label>Holat</label>
        <select id="st-${r.id}">
          ${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${r.status===k?'selected':''}>${v}</option>`).join('')}
        </select>
        <label>Izoh</label>
        <input type="text" id="note-${r.id}" value="${escapeHtml(r.note)}">
        <button class="btn" onclick="workerUpdate('${r.id}')">💾 Yangilash</button>
      </div>`).join('')}
  </div>`;
}

function workerUpdate(id){
  const reports = getReports();
  const idx = reports.findIndex(r=>r.id===id);
  if(idx<0) return;
  reports[idx].status = document.getElementById('st-'+id).value;
  reports[idx].note = document.getElementById('note-'+id).value.trim();
  reports[idx].updatedAt = now();
  setReports(reports);
  toast('Holat yangilandi');
  render();
}

function viewAdmin(){
  const u = guard(['admin']); if(!u) return '';
  const users = getUsers();
  const reports = getReports();
  const rs = reports.map(r=>({...r, citizen: users.find(x=>x.id===r.userId)}));
  const stats = { all: reports.length, new: reports.filter(r=>r.status==='new').length, cleaned: reports.filter(r=>r.status==='cleaned').length };
  return `
  ${topbar('Admin panel','EcoXabar')}
  <div class="content">
    <div class="hero-stats" style="margin-bottom:16px">
      <div class="stat-pill card flat" style="margin:0"><b>${stats.all}</b><span>Jami</span></div>
      <div class="stat-pill card flat" style="margin:0"><b>${stats.new}</b><span>Yangi</span></div>
      <div class="stat-pill card flat" style="margin:0"><b>${stats.cleaned}</b><span>Tozalangan</span></div>
    </div>

    <div class="section-title">Murojaatlar</div>
    ${rs.length===0 ? `<div class="empty"><div class="big">🛡️</div><p>Hozircha murojaat yo‘q.</p></div>` :
      rs.map(r=>`
      <div class="card">
        <div class="meta-row">#${r.id.slice(-5)} · ${r.createdAt}</div>
        <h3>${escapeHtml(r.problem)}</h3>
        <p>👤 ${r.citizen?escapeHtml(r.citizen.name):'—'} | 📞 ${r.citizen?r.citizen.phone:'—'}</p>
        <p>📍 ${escapeHtml(r.address) || 'Manzil yo‘q'}</p>
        ${r.photo ? `<img class="report-photo" src="${r.photo}">` : ''}
        <label>Holat</label>
        <select id="ast-${r.id}">
          ${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${r.status===k?'selected':''}>${v}</option>`).join('')}
        </select>
        <label>Mukofot (so‘m)</label>
        <input type="number" id="arw-${r.id}" min="0" value="${r.reward}">
        <label>Izoh</label>
        <input type="text" id="anote-${r.id}" value="${escapeHtml(r.note)}">
        <button class="btn" onclick="adminUpdate('${r.id}')">💾 Saqlash</button>
      </div>`).join('')}

    <div class="section-title">Foydalanuvchilar</div>
    <div class="card">
      <table>
        <tr><th>Ism</th><th>Telefon</th><th>Rol</th></tr>
        ${users.map(x=>`<tr><td>${escapeHtml(x.name)}</td><td>${x.phone}</td><td>${x.role}</td></tr>`).join('')}
      </table>
    </div>
  </div>`;
}

function adminUpdate(id){
  const reports = getReports();
  const idx = reports.findIndex(r=>r.id===id);
  if(idx<0) return;
  reports[idx].status = document.getElementById('ast-'+id).value;
  reports[idx].reward = Math.max(0, parseInt(document.getElementById('arw-'+id).value||'0',10));
  reports[idx].note = document.getElementById('anote-'+id).value.trim();
  reports[idx].updatedAt = now();
  setReports(reports);
  toast('Saqlandi');
  render();
}

/* ---------------- main render ---------------- */
function render(){
  const app = document.getElementById('app');
  const r = route();
  let html = '';
  switch(r){
    case 'home': html = viewHome(); break;
    case 'login': html = viewLogin(); break;
    case 'register-citizen': html = viewRegister('citizen'); break;
    case 'register-worker': html = viewRegister('worker'); break;
    case 'report': html = viewReportForm(); break;
    case 'my-reports': html = viewMyReports(); break;
    case 'worker': html = viewWorker(); break;
    case 'admin': html = viewAdmin(); break;
    case 'profile': html = viewProfile(); break;
    default: html = viewHome();
  }
  app.innerHTML = html;
  renderTabbar();
  window.scrollTo(0,0);
}
</script>
</body>
</html>
